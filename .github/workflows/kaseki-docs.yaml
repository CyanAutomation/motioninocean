name: Kaseki Docs Sweep via Soyuz

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

run-name: Docs sweep · ${{ github.repository }}@${{ github.sha }}

permissions:
  contents: read

# Configure SOYUZ_BASE_URL and SOYUZ_SUBMISSION_API_TOKEN in the soyuz
# environment. Limit that environment to main without reviewers.
concurrency:
  group: soyuz-docs-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs_sweep:
    name: Submit documentation sweep to Soyuz
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: soyuz
    env:
      SOYUZ_BASE_URL: ${{ vars.SOYUZ_BASE_URL }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main
      TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
      ALLOWLIST: README.md,docs/**/*.md
      VALIDATION_COMMAND: make docs-check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Validate Soyuz URL
        run: node --experimental-strip-types scripts/validate-soyuz-url.ts

      - name: Submit documentation sweep to Soyuz
        id: submit
        shell: bash
        env:
          SOYUZ_SUBMISSION_API_TOKEN: ${{ secrets.SOYUZ_SUBMISSION_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${SOYUZ_SUBMISSION_API_TOKEN:?SOYUZ_SUBMISSION_API_TOKEN is not configured}"
          idempotency_key="$(tr '[:upper:]' '[:lower:]' < /proc/sys/kernel/random/uuid)"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,
                scouting: { enabled: false },
                goalSetting: { enabled: false },
                goalCheck: { enabled: true, maxRetries: 1 },
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: [$validationCommand],
                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --max-filesize 1048576 --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$SOYUZ_BASE_URL/v1/runs" \
              --header "Authorization: Bearer $SOYUZ_SUBMISSION_API_TOKEN" \
              --header "Idempotency-Key: $idempotency_key" \
              --header 'Content-Type: application/json' \
              --data "$payload" || true
          )"

          if [[ ! "$http_status" =~ ^(200|202)$ ]]; then
            echo "::error title=Soyuz submission failed::Soyuz returned HTTP $http_status"
            {
              echo "Soyuz returned HTTP \`$http_status\`. Response body omitted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          run_id="$(jq -er '.data.id | strings' "$response_file")"
          run_id="$(SOYUZ_RUN_ID="$run_id" node --experimental-strip-types scripts/validate-soyuz-run-id.ts)"
          display_id="$(jq -er '.data.displayId | strings | select(test("^soyuz-[0-9]+$"))' "$response_file")"
          run_status="$(jq -er '.data.status | strings | select(test("^(admitting|queued|claimed|running|cancel_requested|cancelled|completed|failed|admission_failed)$"))' "$response_file")"
          {
            printf 'run_id=%s\n' "$run_id"
            printf 'display_id=%s\n' "$display_id"
            printf 'run_status=%s\n' "$run_status"
            printf 'submission_status=accepted\n'
          } >> "$GITHUB_OUTPUT"
          echo "Soyuz accepted the documentation sweep as $display_id."

      - name: Publish Soyuz submission details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          DISPLAY_ID: ${{ steps.submit.outputs.display_id || 'not assigned' }}
          RUN_STATUS: ${{ steps.submit.outputs.run_status || 'not received' }}
          SUBMISSION_STATUS: ${{ steps.submit.outputs.submission_status || 'not accepted' }}
        run: |
          {
            echo '## Soyuz documentation submission'
            echo
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Commit | \`$REF\` |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Submission | \`$SUBMISSION_STATUS\` |"
            echo "| Soyuz run | \`$DISPLAY_ID\` (\`$RUN_ID\`) |"
            echo "| Run status at submission | \`$RUN_STATUS\` |"
            echo
            echo "Accepted means Soyuz admitted the task; it does not confirm execution completion. Monitor the run in the Soyuz dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
