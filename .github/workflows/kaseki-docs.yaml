name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@main

permissions: {}

concurrency:
  group: kaseki-docs-${{ github.repository }}
  cancel-in-progress: false

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  REF: main
  TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
  ALLOWLIST: README.md,docs/**/*.md
  VALIDATION_COMMAND: make docs-check

jobs:
  system_status:
    name: Kaseki System Status
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: kaseki-agent
    env:
      # Do not add a public fallback URL.
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

    steps:
      - name: Verify controller health
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"

          [[ "$KASEKI_BASE_URL" == "https://kaseki-tunnel.scheimann.xyz" ]] || {
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          }

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/health"

          jq -e '.status == "healthy"' "$response_file" >/dev/null

  readiness:
    name: Kaseki System Readiness
    needs: system_status
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: kaseki-agent
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

    steps:
      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"

          [[ "$KASEKI_BASE_URL" == "https://kaseki-tunnel.scheimann.xyz" ]] || {
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          }

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"

          jq -e '.status == "ready"' "$response_file" >/dev/null

  api_connection:
    name: Kaseki API Status
    needs: readiness
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: kaseki-agent
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      # Store this as an environment secret, rather than a repository secret.
      KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}

    steps:
      - name: Verify gateway connectivity and authentication
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          [[ "$KASEKI_BASE_URL" == "https://kaseki-tunnel.scheimann.xyz" ]] || {
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          }

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"

          jq -e '.status == "ok"' "$response_file" >/dev/null

  dispatch:
    name: Submit Kaseki documentation sweep
    needs: api_connection
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment: kaseki-agent
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

    steps:
      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail

          command -v jq >/dev/null
          command -v uuidgen >/dev/null
          command -v curl >/dev/null

      - name: Check Kaseki availability
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"

          [[ "$KASEKI_BASE_URL" == "https://kaseki-tunnel.scheimann.xyz" ]] || {
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          }

          curl --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            "$KASEKI_BASE_URL/ready"

      - name: Verify Kaseki API capabilities
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 20 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/capabilities"
          )"

          if [[ "$http_status" != "200" ]]; then
            echo "::error title=Kaseki capabilities check failed::Kaseki returned HTTP $http_status"
            exit 1
          fi

          if ! jq -e '(.taskModes | index("patch")) != null and (.publishModes | index("pr")) != null' \
            "$response_file" >/dev/null; then
            echo "::error title=Unsupported Kaseki API capabilities::The controller must support patch tasks and pr publishing."
            exit 1
          fi

          echo "Kaseki supports patch tasks and regular PR publishing."

      - name: Verify Kaseki runner preflight
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/preflight"
          )"

          preflight_status="$(jq -r '.status // "unknown"' "$response_file" 2>/dev/null || true)"
          failed_checks="$(jq -r '[.failedChecks[]?.name // empty] | join(", ")' "$response_file" 2>/dev/null || true)"

          if [[ "$http_status" != "200" ]] || \
            ! jq -e '(.status == "ok" or .status == "degraded") and ((.failedChecks // []) | length == 0) and ((.errors // []) | length == 0)' \
              "$response_file" >/dev/null 2>&1; then
            echo "::error title=Kaseki runner preflight failed::HTTP $http_status; status=$preflight_status${failed_checks:+; failed checks=$failed_checks}"
            exit 1
          fi

          echo "Kaseki runner preflight passed (status: $preflight_status)."

      - name: Submit documentation sweep
        id: submit
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          [[ "$KASEKI_BASE_URL" == "https://kaseki-tunnel.scheimann.xyz" ]] || {
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          }

          # Kaseki deduplicates retries using this request-body UUID.
          IDEMPOTENCY_KEY="$(uuidgen | tr '[:upper:]' '[:lower:]')"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$IDEMPOTENCY_KEY" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,

                scouting: {
                  enabled: false
                },

                goalCheck: {
                  enabled: false
                },

                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),

                validationCommands: (
                  if $validationCommand == "" then
                    []
                  else
                    [$validationCommand]
                  end
                ),

                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            controller_error="$(jq -r '
              [
                (.error // empty | tostring),
                (if (.requestId // "") == "" then empty else "requestId=" + (.requestId | tostring) end)
              ]
              | map(gsub("%"; "%25") | gsub("[\\r\\n]"; " ") | .[0:300])
              | map(select(length > 0))
              | join(" ")
            ' "$response_file" 2>/dev/null || true)"

            {
              echo "## Kaseki submission failed"
              echo
              echo "Kaseki returned HTTP \`$http_status\`."
              if [[ -n "$controller_error" ]]; then
                echo
                echo "Controller response: $controller_error"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ -n "$controller_error" ]]; then
              echo "Controller response: $controller_error"
            fi

            exit 1
          fi

          run_id="$(
            jq -er \
              '.id | strings | select(test("^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"))' \
              "$response_file"
          )"

          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id }}
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Kaseki allows three hours per run; poll slightly longer for a final status.
          for _ in $(seq 1 185); do
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --output "$response_file" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/runs/$RUN_ID/status"

            status="$(jq -er '.status' "$response_file")"

            case "$status" in
              completed)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "Kaseki status: completed"
                exit 0
                ;;

              failed)
                failure_class="$(jq -r '.failureClass // ""' "$response_file")"
                if [[ "$failure_class" == "empty-diff" ]]; then
                  echo "status=no_changes" >> "$GITHUB_OUTPUT"
                  echo "Kaseki completed without changes; treating the expected empty diff as a successful no-op."
                  exit 0
                fi

                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "Kaseki run failed (failure class: ${failure_class:-unknown})."
                exit 1
                ;;

              queued|running)
                echo "Kaseki status: $status"
                sleep 60
                ;;

              *)
                echo "::error title=Unexpected Kaseki status::Controller returned an unsupported status"
                exit 1
                ;;
            esac
          done

          echo "status=timed_out" >> "$GITHUB_OUTPUT"
          echo "::error title=Kaseki run timed out::No terminal status after 185 minutes"
          exit 1

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo "## Kaseki submission"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Mode | \`patch\` → \`pr\` (regular PR) |"
            echo "| Timeout | 3 hours |"
            echo "| Maximum diff | 100 KiB |"
            echo "| Kaseki run | \`$RUN_ID\` |"
            echo "| Final status | \`$FINAL_STATUS\` |"
            echo
            echo "### Allowed paths"
            echo '```text'
            echo "$ALLOWLIST" | tr ',' '\n'
            echo '```'
            echo
            echo "### Task description"
            echo "$TASK_DESCRIPTION"
            echo
            echo "### Validation"
            echo '```text'
            echo "${VALIDATION_COMMAND:-No validation command configured}"
            echo '```'
            echo
            echo "Monitor the run: $KASEKI_BASE_URL/ui"
          } >> "$GITHUB_STEP_SUMMARY"
