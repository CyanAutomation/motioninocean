name: Code Quality Autofix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: code-quality-autofix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    name: Run linters and formatters with autofix

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run ruff linter with autofix
        run: |
          echo "Running ruff check with autofix..."
          python -m ruff check pi_camera_in_docker/ tests/ --fix

      - name: Run ruff formatter
        run: |
          echo "Running ruff format..."
          python -m ruff format .

      - name: Run ESLint with autofix
        run: |
          echo "Running ESLint with autofix..."
          npm run lint -- --fix

      - name: Run Prettier formatter
        run: |
          echo "Running Prettier..."
          npx prettier --write "frontend/src/**/*.ts" "eslint.config.js"

      - name: Verify autofixed changes
        run: |
          make ci

      - name: Check for changes
        id: verify-changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "---"
            echo "Modified files:"
            git diff --name-only
            echo "---"
          fi

      - name: Create Pull Request
        if: steps.verify-changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Configure AUTOFIX_GITHUB_TOKEN as a GitHub App token so CI runs on
          # the generated pull request. GITHUB_TOKEN remains a safe fallback.
          token: ${{ secrets.AUTOFIX_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated code quality fixes [nightly]"
          title: "chore: automated code quality fixes (nightly run)"
          body: |
            ## Automated Code Quality Fixes

            This PR contains automated code quality fixes from the nightly autofix workflow.

            **Changes applied:**
            - Ruff linter autofix (ruff check --fix)
            - Ruff code formatter (ruff format)
            - ESLint autofix (npm run lint --fix)
            - Prettier formatter (prettier --write)

            Please review the changes and merge if they look good.
          branch: autofix/nightly-${{ github.run_id }}
          delete-branch: true
          labels: |
            automated
            chore
          assignees: |
            ${{ github.repository_owner }}

      - name: Output summary
        run: |
          echo "## Nightly Autofix Workflow Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify-changes.outputs.has-changes }}" == "true" ]; then
            echo "✅ Changes detected and PR created" >> $GITHUB_STEP_SUMMARY
            echo "- **PR Branch:** autofix/nightly-${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Auto-merge:** Disabled; review and merge after required checks pass" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected - no PR created" >> $GITHUB_STEP_SUMMARY
          fi
