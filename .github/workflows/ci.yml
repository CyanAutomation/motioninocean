name: CI - Test and Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend JS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: |
          npm run build:frontend
          node --test tests/frontend/*.test.mjs

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            production-constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c production-constraints.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@5a1cf8459139fc27cbb1a668abd67082787ad4c2 # v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: htmlcov/

  production-dependency-resolution:
    name: Resolve Python ${{ matrix.python-version }} / ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        platform: [manylinux2014_x86_64, manylinux2014_aarch64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            production-constraints.txt

      - name: Resolve constrained production dependencies
        run: |
          sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' requirements.txt | \
            awk '!/^(numpy)/' > /tmp/requirements-base.txt
          if [ ! -s /tmp/requirements-base.txt ]; then
            echo "Error: Generated requirements-base.txt is empty"
            exit 1
          fi
          python -m pip download \
            --constraint production-constraints.txt \
            --requirement /tmp/requirements-base.txt \
            --dest /tmp/production-wheels \
            --only-binary=:all: \
            --platform "${{ matrix.platform }}" \
            --python-version "${{ matrix.python-version }}"

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            production-constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Run unified lint check
        run: make lint

      - name: Verify frontend TypeScript build
        run: npm run type-check

      - name: Verify generated frontend assets
        run: |
          npm run build:frontend
          git diff --exit-code -- pi_camera_in_docker/static/js

      - name: Run Ruff formatter check
        run: python -m ruff format --check .

      - name: Check feature flag runtime usage
        run: |
          python -m pi_camera_in_docker.feature_flag_usage_check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            production-constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run mypy
        run: |
          python -m mypy pi_camera_in_docker/ --ignore-missing-imports --show-error-codes

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            production-constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Bandit security checks
        run: |
          python -m bandit -r pi_camera_in_docker/ -c pyproject.toml -f json -o bandit-report.json || true
          python -m bandit -r pi_camera_in_docker/ -c pyproject.toml

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-security-report
          path: bandit-report.json
