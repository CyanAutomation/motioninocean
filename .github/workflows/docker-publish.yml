name: Build and publish Docker image

on:
  workflow_dispatch: {}
  # Rebuild the mutable production tag with current Debian security updates.
  schedule:
    - cron: "30 1 2 * *"
  # Publishing a GitHub Release through the UI triggers image verification and publishing.
  release:
    types: [published]

concurrency:
  # Keep scheduled refreshes and published releases that update mutable tags in one queue.
  group: docker-release-publish
  queue: max

permissions: {}

jobs:
  verify:
    name: Verify release candidate
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Run release verification
        run: |
          make ci
          make security

  build:
    name: Build release candidate
    needs: verify
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: docker
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build_candidate.outputs.digest }}
      image_ref: ${{ steps.candidate-ref.outputs.image_ref }}
      amd64_ref: ${{ steps.platform-refs.outputs.amd64_ref }}
      arm64_ref: ${{ steps.platform-refs.outputs.arm64_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.2
          cache-binary: false

      - name: Log in to GHCR for candidate upload
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract candidate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=release-candidate

      - name: Build and push multi-architecture release candidate
        id: build_candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INCLUDE_MOCK_CAMERA=true
            FINAL_APT_CACHE_BUST=${{ github.event_name == 'schedule' && github.run_id || 'stable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          provenance: mode=max
          sbom: true

      - name: Export immutable candidate reference
        id: candidate-ref
        env:
          IMAGE_DIGEST: ${{ steps.build_candidate.outputs.digest }}
        run: |
          set -euo pipefail
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "image_ref=ghcr.io/${REPO_LOWER}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify candidate multi-architecture manifest
        env:
          IMAGE_REF: ${{ steps.candidate-ref.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE_REF" > manifest.json
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")' manifest.json

      - name: Resolve candidate platform references
        id: platform-refs
        env:
          IMAGE_REF: ${{ steps.candidate-ref.outputs.image_ref }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 and (.[0] | test("^sha256:[0-9a-f]{64}$")) then .[0] else error("expected exactly one valid platform digest") end' manifest.json)"
            echo "${arch}_ref=${IMAGE_REF%@*}@${digest}" >> "$GITHUB_OUTPUT"
          done

  scan:
    name: Scan exact release candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: docker
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR to scan candidate
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull amd64 candidate image
        env:
          IMAGE_REF: ${{ needs.build.outputs.amd64_ref }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE_REF"
          docker tag "$IMAGE_REF" motion-in-ocean:scan-amd64

      - name: Enforce HIGH and CRITICAL vulnerabilities on amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motion-in-ocean:scan-amd64
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

      - name: Pull arm64 candidate image
        env:
          IMAGE_REF: ${{ needs.build.outputs.arm64_ref }}
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "$IMAGE_REF"
          docker tag "$IMAGE_REF" motion-in-ocean:scan-arm64

      - name: Enforce HIGH and CRITICAL vulnerabilities on arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motion-in-ocean:scan-arm64
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

  candidate-smoke:
    name: Candidate Runtime Smoke Test (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: docker
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout smoke-test helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Log in to GHCR to run candidate
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate platform image
        env:
          IMAGE_REF: ${{ matrix.arch == 'amd64' && needs.build.outputs.amd64_ref || needs.build.outputs.arm64_ref }}
          PLATFORM: linux/${{ matrix.arch }}
        run: docker pull --platform "$PLATFORM" "$IMAGE_REF"

      - name: Start candidate and check readiness
        env:
          IMAGE_REF: ${{ matrix.arch == 'amd64' && needs.build.outputs.amd64_ref || needs.build.outputs.arm64_ref }}
          PLATFORM: linux/${{ matrix.arch }}
        run: bash scripts/smoke-container-readiness.sh

  publish:
    name: Promote verified images
    needs: [build, scan, candidate-smoke]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: docker
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    outputs:
      ghcr_digest: ${{ steps.published-images.outputs.ghcr_digest }}
      dockerhub_digest: ${{ steps.published-images.outputs.dockerhub_digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.2
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract production image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            cyanautomation/motioninocean
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Promote and verify production image tags
        id: published-images
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          DOCKER_METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash scripts/promote-verified-images.sh

      - name: Attest GHCR image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/cyanautomation/motioninocean
          subject-digest: ${{ steps.published-images.outputs.ghcr_digest }}
          push-to-registry: true

      - name: Attest Docker Hub image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/cyanautomation/motioninocean
          subject-digest: ${{ steps.published-images.outputs.dockerhub_digest }}
          push-to-registry: true
