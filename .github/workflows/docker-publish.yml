name: Build and publish Docker image

on:
  # Manual trigger
  workflow_dispatch: {}
  # Rebuild the mutable production tag with current Debian security updates.
  schedule:
    - cron: "30 1 2 * *"
  # Trigger on pushed tags
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Run release verification
        run: |
          make ci
          make security
      - name: Build release image for vulnerability enforcement
        run: docker build --pull -t motion-in-ocean:release-scan .
      - name: Enforce HIGH and CRITICAL image vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motion-in-ocean:release-scan
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

  build:
    needs: verify
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build_bookworm.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            cyanautomation/motioninocean
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (Debian bookworm) - PRIMARY
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INCLUDE_MOCK_CAMERA=true
            FINAL_APT_CACHE_BUST=${{ github.event_name == 'schedule' && github.run_id || 'stable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          provenance: mode=max
          sbom: true
        id: build_bookworm
      - name: Verify published multi-architecture manifest
        env:
          IMAGE_DIGEST: ${{ steps.build_bookworm.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository }}@$IMAGE_DIGEST" > manifest.json
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")' manifest.json

  release:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract changelog for release
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}

          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH; got $TAG_NAME" >&2; exit 1; }

          echo "Extracting changelog for version: ${VERSION}"

          # Extract the section for this version from CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # Use awk to extract content between version headers
            CHANGELOG_CONTENT=$(awk "/## \[${VERSION}\]/,/## \[.*\]/{if (/## \[${VERSION}\]/) {found=1; next} if (/## \[.*\]/ && found) exit; if (found) print}" CHANGELOG.md | sed '/^$/d')

            if [ -z "$CHANGELOG_CONTENT" ]; then
              echo "Warning: No changelog section found for version ${VERSION}"
              CHANGELOG_CONTENT="Release ${VERSION} - See commit history for details."
            else
              echo "Found changelog section for version ${VERSION}"
            fi
          else
            echo "Warning: CHANGELOG.md not found"
            CHANGELOG_CONTENT="Release ${VERSION} - See commit history for details."
          fi

          # Write to file to preserve multiline content
          echo "$CHANGELOG_CONTENT" > /tmp/changelog.txt
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

          # Debug output
          echo "Changelog content length: $(wc -c < /tmp/changelog.txt) bytes"

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e

          # Read changelog from file
          CHANGELOG_BODY=$(cat /tmp/changelog.txt)

          # Get variables
          TAG_NAME="${{ steps.changelog.outputs.tag_name }}"
          VERSION="${{ steps.changelog.outputs.version }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(basename "${{ github.repository }}")

          # Build release notes incrementally
          {
            echo "$CHANGELOG_BODY"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "Pull the image (GitHub Container Registry):"
            echo '```bash'
            echo "docker pull ghcr.io/${REPO_LOWER}:${TAG_NAME}"
            echo "# or"
            echo "docker pull ghcr.io/${REPO_LOWER}:${VERSION}"
            echo "# or"
            echo "docker pull ghcr.io/${REPO_LOWER}:latest"
            echo '```'
            echo ""
            echo "Pull the image (Docker Hub):"
            echo '```bash'
            echo "docker pull cyanautomation/motioninocean:${TAG_NAME}"
            echo "# or"
            echo "docker pull cyanautomation/motioninocean:${VERSION}"
            echo "# or"
            echo "docker pull cyanautomation/motioninocean:latest"
            echo '```'
            echo ""
            echo "View on GitHub Container Registry: https://github.com/${{ github.repository }}/pkgs/container/${REPO_NAME}"
            echo "View on Docker Hub: https://hub.docker.com/r/cyanautomation/motioninocean"
            echo ""
            echo "Image digest: \`${{ needs.build.outputs.image_digest }}\`"
          } > /tmp/release_notes.md

          echo "Release notes built successfully"
          echo "Release notes length: $(wc -c < /tmp/release_notes.md) bytes"

      - name: Validate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e

          # Check if release notes file exists and is not empty
          if [ ! -f /tmp/release_notes.md ]; then
            echo "Error: Release notes file not found"
            exit 1
          fi

          if [ ! -s /tmp/release_notes.md ]; then
            echo "Error: Release notes file is empty"
            exit 1
          fi

          # Check minimum length (at least 10 characters)
          NOTES_LENGTH=$(wc -c < /tmp/release_notes.md)
          if [ "$NOTES_LENGTH" -lt 10 ]; then
            echo "Error: Release notes too short (${NOTES_LENGTH} bytes)"
            exit 1
          fi

          echo "✓ Release notes validation passed"
          echo "  Length: ${NOTES_LENGTH} bytes"

          # Show preview (first 200 chars)
          echo "  Preview:"
          head -c 200 /tmp/release_notes.md
          echo ""

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          TAG_NAME="${{ steps.changelog.outputs.tag_name }}"

          echo "Creating GitHub Release for ${TAG_NAME}"

          # Create release using gh CLI with notes from file
          gh release create "${TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --title "Release ${TAG_NAME}" \
            --notes-file /tmp/release_notes.md

          echo "✓ GitHub Release created successfully"
          echo "  URL: https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
