name: Security - Docker Image Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image for scanning
        run: |
          docker build --pull -t motion-in-ocean:scan .

      - name: Verify patched libpcre2 package
        run: |
          set -euo pipefail
          docker run --rm --entrypoint dpkg-query motion-in-ocean:scan \
            -W -f='${Package}\t${Version}\n' | sort > docker-package-inventory.txt
          installed_version=$(awk '$1 == "libpcre2-8-0" { print $2 }' \
            docker-package-inventory.txt)
          echo "libpcre2-8-0=${installed_version}"
          test -n "${installed_version}"
          dpkg --compare-versions "${installed_version}" ge "10.42-1+deb12u1"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "motion-in-ocean:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          vuln-type: "os,library"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy in table format
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "motion-in-ocean:scan"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate Trivy report artifact
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "motion-in-ocean:scan"
          format: "json"
          output: "trivy-report.json"
          ignore-unfixed: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-security-report
          path: |
            trivy-results.sarif
            trivy-report.json
            docker-package-inventory.txt
