name: Security - Docker Image Scan

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch: {}

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy Security Scan
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      sarif-produced: ${{ steps.sarif-state.outputs.produced }}
      report-artifact-uploaded: ${{ steps.report-upload.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Docker image for scanning
        run: |
          docker build --pull -t motion-in-ocean:scan .

      - name: Verify patched libpcre2 package
        run: |
          set -euo pipefail
          docker run --rm --entrypoint dpkg-query motion-in-ocean:scan \
            -W -f='${Package}\t${Version}\n' | sort > docker-package-inventory.txt
          installed_version=$(awk '$1 == "libpcre2-8-0" { print $2 }' \
            docker-package-inventory.txt)
          echo "libpcre2-8-0=${installed_version}"
          test -n "${installed_version}"
          dpkg --compare-versions "${installed_version}" ge "10.42-1+deb12u1"

      - name: Verify Python runtime dependency inventory
        run: |
          docker run --rm --entrypoint python3 motion-in-ocean:scan -c '
          import sys
          from importlib.metadata import distributions, version
          from pathlib import Path
          from re import findall
          from sysconfig import get_path

          msgpack_version = version("msgpack")
          assert tuple(map(int, findall(r"\d+", msgpack_version)[:3])) >= (1, 2, 2)
          print(f"msgpack={msgpack_version}")

          venv_site = get_path("purelib")
          assert Path(venv_site).is_relative_to("/opt/venv"), venv_site
          normalize = lambda name: name.lower().replace("_", "-")
          venv_inventory = {
              normalize(dist.metadata["Name"])
              for dist in distributions(path=[venv_site])
          }
          forbidden = {"pip", "setuptools", "wheel"}
          remaining = forbidden & venv_inventory
          assert not remaining, f"venv-local build tools remain: {sorted(remaining)}"
          print(f"venv-local build tools absent from {venv_site}: {sorted(forbidden)}")

          system_paths = [
              path for path in sys.path
              if path and not Path(path).is_relative_to("/opt/venv")
          ]
          system_inventory = {
              normalize(dist.metadata["Name"]): str(dist.locate_file(""))
              for dist in distributions(path=system_paths)
              if normalize(dist.metadata["Name"]) in forbidden
          }
          print(f"Debian system package distributions (inherited, not venv-local): {system_inventory}")
          '

      # Reporting scans are informational and deliberately include every severity.
      # The final enforcement scan is the only merge-blocking vulnerability step.
      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "motion-in-ocean:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          vuln-type: "os,library"
          ignore-unfixed: false
          exit-code: "0"

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "motion-in-ocean:scan"
          format: "json"
          output: "trivy-report.json"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          vuln-type: "os,library"
          ignore-unfixed: false
          exit-code: "0"

      - name: Generate Trivy human-readable report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "motion-in-ocean:scan"
          format: "table"
          output: "trivy-report.txt"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          vuln-type: "os,library"
          ignore-unfixed: false
          exit-code: "0"

      - name: Check whether Trivy produced SARIF
        id: sarif-state
        if: always()
        shell: bash
        run: |
          if [[ -s trivy-results.sarif ]]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Trivy reports
        id: report-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-security-report
          path: |
            trivy-results.sarif
            trivy-report.json
            trivy-report.txt
            docker-package-inventory.txt
          # Report collection is best-effort so a missing report cannot skip enforcement.
          if-no-files-found: warn

      # Only fixed HIGH or CRITICAL OS/library vulnerabilities block the merge.
      # Lower severities remain visible in the reports uploaded above for triage.
      - name: Enforce HIGH and CRITICAL vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "motion-in-ocean:scan"
          format: "table"
          severity: "HIGH,CRITICAL"
          vuln-type: "os,library"
          ignore-unfixed: true
          exit-code: "1"

  upload-sarif:
    name: Publish Trivy findings to GitHub Security
    needs: scan
    if: >-
      always() &&
      needs.scan.result != 'cancelled' &&
      needs.scan.outputs.sarif-produced == 'true' &&
      needs.scan.outputs.report-artifact-uploaded == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Download Trivy reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: trivy-security-report
          path: trivy-security-report

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-security-report/trivy-results.sarif

  arm64-smoke:
    name: ARM64 Image Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: docker buildx build --platform linux/arm64 --build-arg INCLUDE_MOCK_CAMERA=true --load --tag motion-in-ocean:arm64-smoke .
      - run: docker run --rm --platform linux/arm64 --entrypoint python3 motion-in-ocean:arm64-smoke -c 'import platform; import pi_camera_in_docker; print(platform.machine())'
