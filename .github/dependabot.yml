version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development-dependencies:
        dependency-type: development

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
