version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint 8.67.0 supports TypeScript >=4.8.4 and <6.1.0.
      # Remove this guard when the installed typescript-eslint release supports v7.
      - dependency-name: "typescript"
        versions:
          - ">=6.1.0"
