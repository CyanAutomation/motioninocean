<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion In Ocean API</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/api-docs.css') }}" />
    <script defer src="{{ url_for('static', filename='js/api-docs.js') }}"></script>
  </head>
  <body>
    <main id="api-reference" data-spec-url="{{ url_for('openapi_spec') }}">
      <header class="page-header">
        <p class="eyebrow">Motion In Ocean</p>
        <h1>API reference</h1>
        <p id="api-description">Loading the local OpenAPI document…</p>
        <a href="{{ url_for('openapi_spec') }}">Open the OpenAPI JSON document</a>
      </header>
      <p id="load-error" class="load-error" role="alert" hidden></p>
      <section aria-labelledby="operations-heading">
        <h2 id="operations-heading">Operations</h2>
        <div id="operations" class="operation-list"></div>
      </section>
      <section aria-labelledby="schemas-heading">
        <h2 id="schemas-heading">Schemas</h2>
        <div id="schemas" class="schema-list"></div>
      </section>
    </main>
  </body>
</html>
